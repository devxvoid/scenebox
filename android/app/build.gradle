plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scenebox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.scenebox'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

flutter {
    source '../..'
}
